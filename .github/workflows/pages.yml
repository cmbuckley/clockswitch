name: Deploy Jekyll site to Pages
on:
  push:
    branches: main
  repository_dispatch:
    types: [pages]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  pages:
    uses: cmbuckley/.github/.github/workflows/pages.yml@main
    secrets: inherit
    with:
      custom_commands: |
        cd _data
        npm install --package-lock-only
